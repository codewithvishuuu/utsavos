name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: utsavos
          POSTGRES_PASSWORD: utsavos_dev
          POSTGRES_DB: utsavos
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U utsavos -d utsavos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Migrations
        run: alembic upgrade head
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-only-secret-key-that-is-long-enough
          DATABASE_URL: postgresql+psycopg://utsavos:utsavos_dev@localhost:5432/utsavos
      - name: Pytest
        run: pytest -q
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-only-secret-key-that-is-long-enough
          DATABASE_URL: postgresql+psycopg://utsavos:utsavos_dev@localhost:5432/utsavos_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
