dth="220" height="64" rx="12" fill="none" stroke="#DED5C8" stroke-width="1" stroke-dasharray="3 3"/><text x="32" y="296" class="sans" font-size="11.5" font-weight="500" fill="#5E574E" text-anchor="start">No celebration selected</text><text x="32" y="314" class="sans" font-size="9.5" font-weight="400" fill="#7A7065" text-anchor="start">Create one to unlock event tools</text><text x="32" y="360" class="sans" font-size="10.5" font-weight="400" fill="#7A7065" text-anchor="start">Event tools appear after you</text><text x="32" y="376" class="sans" font-size="10.5" font-weight="400" fill="#7A7065" text-anchor="start">create a celebration.</text><line x1="24" y1="628" x2="228" y2="628" stroke="#DED5C8" stroke-width="1"/><text x="24" y="652" class="mono" font-size="8" font-weight="600" fill="#7A7065" text-anchor="start" letter-spacing="0.18em">RESOURCES</text><text x="32" y="680" class="sans" font-size="12.5" font-weight="400" fill="#5E574E" text-anchor="start">Public demo</text><line x1="214" y1="676" x2="224" y2="676" stroke="#7A7065" stroke-width="1.4"/><line x1="220" y1="672" x2="224" y2="676" stroke="#7A7065" stroke-width="1.4"/><line x1="220" y1="680" x2="224" y2="676" stroke="#7A7065" stroke-width="1.4"/><circle cx="27" cy="748" r="3" fill="none" stroke="#7A7065" stroke-width="1"/><text x="36" y="752" class="sans" font-size="10" font-weight="400" fill="#5E574E" text-anchor="start">Local workspace</text><text x="36" y="765" class="sans" font-size="8.5" font-weight="400" fill="#7A7065" text-anchor="start">Engine status not monitored</text><rect x="16" y="780" width="220" height="64" rx="12" fill="#FFFDF9" stroke="#DED5C8" stroke-width="1"/><circle cx="36" cy="812" r="16" fill="#F4EDE3" stroke="none" stroke-width="1"/><text x="36" y="817" class="serif" font-size="15" font-weight="400" fill="#12100E" text-anchor="middle">A</text><text x="60" y="806" class="sans" font-size="12" font-weight="600" fill="#12100E" text-anchor="start">Ananya K.</text><text x="60" y="822" class="mono" font-size="8" font-weight="400" fill="#7A7065" text-anchor="start" letter-spacing="0.08em">SAMPLE WORKSPACE</text><line x1="218" y1="807" x2="223" y2="812" stroke="#7A7065" stroke-width="1.3"/><line x1="223" y1="812" x2="218" y2="817" stroke="#7A7065" stroke-width="1.3"/><text x="24" y="872" class="mono" font-size="8" font-weight="400" fill="#7A7065" text-anchor="start" letter-spacing="0.12em">v0.1 · LOCAL</text><rect x="252" y="0" width="1188" height="68" rx="0" fill="#FAF6F0" stroke="none" stroke-width="1"/><line x1="252" y1="68" x2="1440" y2="68" stroke="#DED5C8" stroke-width="1"/><text x="284" y="40" class="sans" font-size="11.5" font-weight="400" fill="#5E574E" text-anchor="start">Workspace</text><text x="348" y="40" class="sans" font-size="11.5" font-weight="400" fill="#7A7065" text-anchor="start">/</text><text x="364" y="40" class="sans" font-size="11.5" font-weight="600" fill="#12100E" text-anchor="start">Dashboard</text><rect x="448" y="27" width="58" height="20" rx="10" fill="#F4EDE3" stroke="#DED5C8" stroke-width="1"/><text x="458" y="39.7" class="mono" font-size="7.5" font-weight="600" fill="#7A7065" text-anchor="start" letter-spacing="0.09em">SAMPLE</text><rect x="1036" y="16" width="142" height="36" rx="10" fill="#FFFDF9" stroke="#C9BDAE" stroke-width="1"/><text x="1107" y="38" class="sans" font-size="11.5" font-weight="600" fill="#12100E" text-anchor="middle">Simulate change</text><rect x="1192" y="16" width="124" height="36" rx="10" fill="#A84422" stroke="none" stroke-width="1"/><line x1="1205" y1="29" x2="1205" y2="39" stroke="#FAF6F0" stroke-width="1.5"/><line x1="1200" y1="34" x2="1210" y2="34" stroke="#FAF6F0" stroke-width="1.5"/><text x="1218" y="38" class="sans" font-size="11.5" font-weight="600" fill="#FAF6F0" text-anchor="start">Create event</text><text x="284" y="110" class="mono" font-size="8.5" font-weight="600" fill="#7A7065" text-anchor="start" letter-spacing="0.16em">WEDNESDAY, 21 OCTOBER 2026 · SAMPLE WORKSPACE</text><text x="284" y="150" class="serif" font-size="42" font-weight="400" fill="#12100E" text-anchor="start" letter-spacing="-0.035em">Good afternoon, Ananya.</text><text x="284" y="176" class="sans" font-size="13" font-weight="400" fill="#5E574E" text-anchor="start">Your workspace is ready. Create your first celebration to start planning.</text><rect x="284" y="192" width="1124" height="420" rx="20" fill="#FFFDF9" stroke="#DED5C8" stroke-width="1"/><g opacity="0.08" fill="none" stroke="#A84422" stroke-width="1">
    <path d="M 1000 552 C 1000 321.6, 1061.2 232, 1170 232 C 1278.8 232, 1340 321.6, 1340 552"/>
