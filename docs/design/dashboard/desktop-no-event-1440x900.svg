    <circle cx="1170" cy="302.4" r="3" fill="#A84422" stroke="none"/>
  </g><text x="324" y="244" class="mono" font-size="8.5" font-weight="600" fill="#7A7065" text-anchor="start" letter-spacing="0.16em">YOUR FIRST CELEBRATION</text><text x="324" y="296" class="serif" font-size="36" font-weight="400" fill="#12100E" text-anchor="start" letter-spacing="-0.03em">Start with the celebration.</text><text x="324" y="326" class="sans" font-size="13" font-weight="400" fill="#5E574E" text-anchor="start">Set the date, guest baseline, budget and reserve. UtsavOS builds the</text><text x="324" y="346" class="sans" font-size="13" font-weight="400" fill="#5E574E" text-anchor="start">deterministic baseline, then lets you simulate every change before it</text><text x="324" y="366" class="sans" font-size="13" font-weight="400" fill="#5E574E" text-anchor="start">becomes the plan.</text><rect x="324" y="398" width="144" height="44" rx="10" fill="#A84422" stroke="none" stroke-width="1"/><line x1="337" y1="415" x2="337" y2="425" stroke="#FAF6F0" stroke-width="1.5"/><line x1="332" y1="420" x2="342" y2="420" stroke="#FAF6F0" stroke-width="1.5"/><text x="350" y="424" class="sans" font-size="12" font-weight="600" fill="#FAF6F0" text-anchor="start">Create event</text><rect x="484" y="398" width="184" height="44" rx="10" fill="#FFFDF9" stroke="#C9BDAE" stroke-width="1"/><text x="576" y="424" class="sans" font-size="12" font-weight="600" fill="#12100E" text-anchor="middle">Explore the public demo</text><text x="324" y="468" class="sans" font-size="10.5" font-weight="400" fill="#7A7065" text-anchor="start">No account needed for the public demo. Synthetic data, real deterministic calculations.</text><text x="284" y="664" class="serif" font-size="26" font-weight="400" fill="#12100E" text-anchor="start" letter-spacing="-0.02em">What you can organize</text><text x="284" y="684" class="sans" font-size="10.5" font-weight="400" fill="#5E574E" text-anchor="start">One shared language for the plan, the people and the money.</text><rect x="284" y="712" width="356" height="136" rx="16" fill="#FFFDF9" stroke="#DED5C8" stroke-width="1"/><text x="304" y="744" class="mono" font-size="9" font-weight="600" fill="#A84422" text-anchor="start" letter-spacing="0.08em">01</text><text x="304" y="776" class="serif" font-size="19" font-weight="400" fill="#12100E" text-anchor="start">Weddings</text><text x="304" y="800" class="sans" font-size="10" font-weight="400" fill="#5E574E" text-anchor="start">Budget, reserve, ceremonies, guests</text><text x="304" y="816" class="sans" font-size="10" font-weight="400" fill="#5E574E" text-anchor="start">and vendor quotes in one plan.</text><rect x="664" y="712" width="356" height="136" rx="16" fill="#FFFDF9" stroke="#DED5C8" stroke-width="1"/><text x="684" y="744" class="mono" font-size="9" font-weight="600" fill="#A84422" text-anchor="start" letter-spacing="0.08em">02</text><text x="684" y="776" class="serif" font-size="19" font-weight="400" fill="#12100E" text-anchor="start">Multi-ceremony celebrations</text><text x="684" y="800" class="sans" font-size="10" font-weight="400" fill="#5E574E" text-anchor="start">Keep each ceremony and its timeline</text><text x="684" y="816" class="sans" font-size="10" font-weight="400" fill="#5E574E" text-anchor="start">connected to the same budget.</text><rect x="1044" y="712" width="356" height="136" rx="16" fill="#FFFDF9" stroke="#DED5C8" stroke-width="1"/><text x="1064" y="744" class="mono" font-size="9" font-weight="600" fill="#A84422" text-anchor="start" letter-spacing="0.08em">03</text><text x="1064" y="776" class="serif" font-size="19" font-weight="400" fill="#12100E" text-anchor="start">Milestone events</text><text x="1064" y="800" class="sans" font-size="10" font-weight="400" fill="#5E574E" text-anchor="start">Plan the date, headcount and spend,</text><text x="1064" y="816" class="sans" font-size="10" font-weight="400" fill="#5E574E" text-anchor="start">then review every change.</text>
