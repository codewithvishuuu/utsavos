<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">UtsavOS dashboard — proposal states</title>
<desc id="desc">Component state sheet for pending, stale, no-pending, approved and rejected proposal states, with explicit state rules and sample-data disclosure.</desc>
<style>
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif; }
  .sans { font-family: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-variant-numeric: tabular-nums; }
  text { white-space: pre; }
</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FAF6F0" stroke="none" stroke-width="1"/><text x="64" y="58" class="mono" font-size="8.5" font-weight="600" fill="#7A7065" text-anchor="start" letter-spacing="0.16em">COMPONENT STATE SHEET</text><text x="64" y="104" class="serif" font-size="40" font-weight="400" fill="#12100E" text-anchor="start" letter-spacing="-0.03em">Proposal states</text><text x="64" y="132" class="sans" font-size="12" font-weight="400" fill="#5E574E" text-anchor="start">Pending, stale, no-pending and decided states. Inspection and approval remain separate actions.</text><rect x="64" y="148" width="58" height="20" rx="10" fill="#F4EDE3" stroke="#DED5C8" stroke-width="1"/><text x="74" y="160.7" class="mono" font-size="7.5" font-weight="600" fill="#7A7065" text-anchor="start" letter-spacing="0.09em">SAMPLE</text><text x="64" y="204" class="mono" font-size="8" font-weight="600" fill="#A84422" text-anchor="start" letter-spacing="0.12em">01 · PENDING</text><rect x="64" y="220" width="1312" height="104" rx="16" fill="#FBF0E9" stroke="#E8C9B8" stroke-width="1"/><rect x="64" y="220" width="4" height="104" rx="2" fill="#C85A32" stroke="none" stroke-width="1"/><rect x="88" y="236" width="116" height="20" rx="10" fill="#F6E4DA" stroke="none" stroke-width="1"/><circle cx="98" cy="246" r="3" fill="#C85A32" stroke="none" stroke-width="1"/><text x="106" y="248.7" class="mono" font-size="7.5" font-weight="600" fill="#A84422" text-anchor="start" letter-spacing="0.09em">AWAITING REVIEW</text><text x="216" y="250" class="mono" font-size="8.5" font-weight="400" fill="#5E574E" text-anchor="start" letter-spacing="0.03em">Draft · base v1 · Not applied</text><text x="88" y="280" class="serif" font-size="22" font-weight="400" fill="#12100E" text-anchor="start" letter-spacing="-0.02em">Guest count 180 → 240</text><text x="88" y="302" class="sans" font-size="11" font-weight="400" fill="#5E574E" text-anchor="start">Deterministic impact:</text><text x="214" y="302" class="mono" font-size="10.5" font-weight="500" fill="#A84422" text-anchor="start">Projected spend +₹2,35,200</text><text x="406" y="302" class="sans" font-size="11" font-weight="400" fill="#7A7065" text-anchor="start">·</text><text x="418" y="302" class="mono" font-size="10.5" font-weight="500" fill="#A84422" text-anchor="start">Spendable shortfall ₹80,800</text><rect x="1096" y="238" width="144" height="36" rx="10" fill="#A84422" stroke="none" stroke-width="1"/><text x="1168" y="260" class="sans" font-size="11.5" font-weight="600" fill="#FAF6F0" text-anchor="middle">Inspect proposal</text><text x="1096" y="298" class="sans" font-size="11" font-weight="600" fill="#A84422" text-anchor="start">Review in Studio</text><line x1="1190" y1="294" x2="1200" y2="294" stroke="#A84422" stroke-width="1.4"/><line x1="1196" y1="290" x2="1200" y2="294" stroke="#A84422" stroke-width="1.4"/><line x1="1196" y1="298" x2="1200" y2="294" stroke="#A84422" stroke-width="1.4"/><text x="64" y="348" class="mono" font-size="8" font-weight="600" fill="#A36A1F" text-anchor="start" letter-spacing="0.12em">02 · STALE</text><rect x="64" y="364" width="1312" height="104" rx="16" fill="#F8EEDC" stroke="#E4C9A4" stroke-width="1"/><rect x="64" y="364" width="4" height="104" rx="2" fill="#A36A1F" stroke="none" stroke-width="1"/><rect x="88" y="380" width="116" height="20" rx="10" fill="#F1E0C4" stroke="none" stroke-width="1"/><circle cx="98" cy="390" r="3" fill="#A36A1F" stroke="none" stroke-width="1"/><text x="106" y="392.7" class="mono" font-size="7.5" font-weight="600" fill="#A36A1F" text-anchor="start" letter-spacing="0.09em">BASELINE CHANGED</text><text x="216" y="394" class="mono" font-size="8.5" font-weight="400" fill="#5E574E" text-anchor="start" letter-spacing="0.03em">Draft · prepared against v1 · Plan now v2</text><text x="88" y="424" class="serif" font-size="21" font-weight="400" fill="#12100E" text-anchor="start" letter-spacing="-0.02em">Review the new baseline before approving.</text><text x="88" y="446" class="sans" font-size="10.5" font-weight="400" fill="#5E574E" text-anchor="start">Approval is blocked until the draft is re-simulated. The saved plan has not changed.</text><rect x="1096" y="382" width="144" height="36" rx="10" fill="#A36A1F" stroke="none" stroke-width="1"/><text x="1168" y="404" class="sans" font-size="11.5" font-weight="600" fill="#FAF6F0" text-anchor="middle">Review changes</text><text x="1096" y="442" class="sans" font-size="11" font-weight="600" fill="#A36A1F" text-anchor="start">Re-simulate</text><line x1="1170" y1="438" x2="1180" y2="438" stroke="#A36A1F" stroke-width="1.4"/><line x1="1176" y1="434" x2="1180" y2="438" stroke="#A36A1F" stroke-width="1.4"/><line x1="1176" y1="442" x2="1180" y2="438" stroke="#A36A1F" stroke-width="1.4"/><text x="64" y="492" class="mono" font-size="8" font-weight="600" fill="#3F4A3E" text-anchor="start" letter-spacing="0.12em">03 · NO PENDING PROPOSAL</text><rect x="64" y="508" width="1312" height="72" rx="14" fill="#FFFDF9" stroke="#DED5C8" stroke-width="1"/><circle cx="84" cy="544" r="3" fill="#5F6F5E" stroke="none" stroke-width="1"/><text x="96" y="548" class="sans" font-size="11" font-weight="500" fill="#12100E" text-anchor="start">No proposals awaiting review.</text><text x="96" y="564" class="sans" font-size="9.5" font-weight="400" fill="#5E574E" text-anchor="start">The dashboard omits the terracotta banner. Open Studio to simulate a change.</text><text x="1356" y="548" class="sans" font-size="10.5" font-weight="600" fill="#A84422" text-anchor="end">Open Studio</text><line x1="1272" y1="544" x2="1281" y2="544" stroke="#A84422" stroke-width="1.4"/><line x1="1277" y1="540" x2="1281" y2="544" stroke="#A84422" stroke-width="1.4"/><line x1="1277" y1="548" x2="1281" y2="544" stroke="#A84422" stroke-width="1.4"/><text x="64" y="616" class="mono" font-size="8" font-weight="600" fill="#7A7065" text-anchor="start" letter-spacing="0.12em">04 · DECIDED</text><rect x="64" y="632" width="420" height="92" rx="14" fill="#E8EEE4" stroke="#CAD8C4" stroke-width="1"/><circle cx="84" cy="656" r="3" fill="#5F6F5E" stroke="none" stroke-width="1"/><text x="96" y="660" class="mono" font-size="7.5" font-weight="600" fill="#3F4A3E" text-anchor="start" letter-spacing="0.1em">APPROVED</text><text x="84" y="688" class="serif" font-size="19" font-weight="400" fill="#12100E" text-anchor="start">Revision v2 recorded</text><text x="84" y="708" class="sans" font-size="9" font-weight="400" fill="#5E574E" text-anchor="start">The plan now includes 240 guests and the approved revision is applied.</text><rect x="500" y="632" width="420" height="92" rx="14" fill="#F4EDE3" stroke="#DED5C8" stroke-width="1"/><circle cx="520" cy="656" r="3" fill="#7A7065" stroke="none" stroke-width="1"/><text x="532" y="660" class="mono" font-size="7.5" font-weight="600" fill="#5E574E" text-anchor="start" letter-spacing="0.1em">REJECTED</text><text x="520" y="688" class="serif" font-size="19" font-weight="400" fill="#12100E" text-anchor="start">Plan unchanged</text><text x="520" y="708" class="sans" font-size="9" font-weight="400" fill="#5E574E" text-anchor="start">The proposal is retained for audit; no revision is written.</text><rect x="936" y="632" width="440" height="92" rx="14" fill="#F8EEDC" stroke="#E4C9A4" stroke-width="1"/><circle cx="956" cy="656" r="3" fill="#A36A1F" stroke="none" stroke-width="1"/><text x="968" y="660" class="mono" font-size="7.5" font-weight="600" fill="#A36A1F" text-anchor="start" letter-spacing="0.1em">STALE</text><text x="956" y="688" class="serif" font-size="19" font-weight="400" fill="#12100E" text-anchor="start">Baseline changed</text><text x="956" y="708" class="sans" font-size="9" font-weight="400" fill="#5E574E" text-anchor="start">Approval is blocked; re-simulate against the current plan version.</text><text x="64" y="764" class="serif" font-size="22" font-weight="400" fill="#12100E" text-anchor="start">State rules</text><text x="64" y="788" class="mono" font-size="9.5" font-weight="400" fill="#5E574E" text-anchor="start">Pending: proposal.status === "draft" and proposal.base_version === event.version.</text><text x="64" y="806" class="mono" font-size="9.5" font-weight="400" fill="#5E574E" text-anchor="start">Stale: proposal.status === "draft" and proposal.base_version &lt; event.version, or approval returned 409 baseline_changed.</text><text x="64" y="824" class="mono" font-size="9.5" font-weight="400" fill="#5E574E" text-anchor="start">Approved/rejected: show in revision history, not in the attention banner. No auto-approval and no optimistic mutation.</text><text x="64" y="860" class="sans" font-size="10" font-weight="400" fill="#7A7065" text-anchor="start">Sample values are from the existing flagship fixture. They are not production data.</text>
</svg>