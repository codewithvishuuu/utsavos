# Render Blueprint for UtsavOS.
# One web service built from the root Dockerfile serves the SPA and the API on
# the SAME origin, which preserves the app's security model: __Host- session
# cookies, SameSite=Lax, CSRF double-submit, and no CORS in production.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: utsavos
    runtime: docker
    plan: free # upgrade to 0.5c-512mb ($7/mo) for an always-on instance
    region: singapore
    branch: main
    # Fast, dependency-free deploy-gating check; /readyz additionally verifies
    # the database, verified TLS and the migration head (see ops runbook).
    healthCheckPath: /healthz
    # `python -m utsavos.deploy` upgrades the fromDatabase internal URL to the
    # External host with sslmode=verify-full&sslrootcert=system (internal
    # connections only support self-signed TLS, but production validation
    # requires verified TLS), runs `alembic upgrade head`, then serves on
    # 0.0.0.0:$PORT with one worker (in-process rate limiters). Fails closed.
    dockerCommand: python -m utsavos.deploy
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true # 256-bit random; never committed
      # Wired automatically by Render (resolve at sync time): the internal
      # connection string of the database declared below. No secret is ever
      # entered, stored in Git, or exposed to the chat/logs. See
      # apps/api/src/utsavos/deploy.py for the verified-TLS upgrade.
      - key: DATABASE_URL
        fromDatabase:
          name: utsavos-pg
          property: connectionString
      - key: DB_REGION
        value: singapore
      - key: AI_LOCAL_ENABLED
        value: "false"
      - key: CLOUD_AI_ENABLED
        value: "false" # enable only with GEMINI_API_KEY; consent rules still apply
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: utsavos-pg
    databaseName: utsavos
    user: utsavos
    plan: free # Free Postgres expires 30 days after creation (14-day grace)
    region: singapore
    postgresMajorVersion: "16" # matches the docker-compose/db pinned version
